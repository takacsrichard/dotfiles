# declarative tag taxonomy + filename-based auto-classify rules for paperless-ngx.
# edit this file, then run ./sync.py to push it to the running instance (idempotent).
#
# each entry becomes:
#  - a Tag (plain, no content-matching -- content OCR matching is unreliable for
#    scans, so classification happens on filename instead via a Workflow)
#  - a Workflow with one "consumption started" trigger per filename glob, which
#    assigns the tag to any newly consumed file whose name matches.
#
# globs are case-insensitive, * wildcards, matched against the filename only.

paperless_url: http://localhost:8000
tags:
  health_records:
    globs: ["*bloodwork*", "*dental*", "*orthodontic*", "*ankle*", "*nosebleed*",
            "*chemical_burn*", "*astigmatism*", "*color_deficiency*", "*xray*",
            "*immunization*"]
  vaccination:
    globs: ["*vaccination*", "*impfpass*", "*eimpfpass*"]
  insurance:
    globs: ["*insurance*", "*versicherung*", "*jogviszony*", "*taj_invalidation*"]
  identity:
    globs: ["*passport*", "*ecard*", "*icard*", "*ausweis*", "*azonosito*",
            "*strafregister*", "*signature*", "*bankcard*"]
  residence:
    globs: ["*meldezettel*", "*anmeldebescheinigung*", "*lease*", "*dormy*",
            "*accommodation_contract*", "*heimstatut*"]
  visa:
    globs: ["*visa*", "*ds160*", "*ds_2019*", "*i94*", "*sevis*", "*dv26*",
            "*i_901*"]
  security:
    globs: ["*pin_puk*", "*bitwarden*", "*authenticator*", "*_recovery_*"]
  financial:
    globs: ["*financial*", "*sponsor*", "*funds_confirmation*", "*payment_acceptance*"]
  education:
    globs: ["*lebenslauf*", "*cv_*", "*studierendenausweis*", "*notice_of_admission*",
            "*uiuc*"]
  duplicate:
    globs: ["*duplicate*"]

  # --- general everyday categories (gdrive:paperless dump folder) ---------
  invoices_receipts:
    globs: ["*rechnung*", "*quittung*", "*beleg*", "*kassenbon*", "*kassazettel*",
            "*invoice*", "*receipt*", "*bill*", "*szamla*", "*nyugta*", "*blokk*"]
  supermarket:
    globs: ["*spar*", "*hofer*", "*billa*", "*penny*", "*lidl*"]
  bank_statements:
    globs: ["*kontoauszug*", "*bankauszug*", "*bank_statement*", "*bankstatement*",
            "*szamlakivonat*", "*bankszamlakivonat*"]
  utilities:
    globs: ["*strom*", "*gas_*", "*_gas*", "*wasser*", "*telefon*", "*internet*",
            "*rezsi*", "*kozuzemi*", "*utility*", "*nebenkosten*"]
  payslips:
    globs: ["*lohnzettel*", "*lohnabrechnung*", "*gehaltsabrechnung*", "*payslip*",
            "*fizetesi*", "*berpapir*", "*berjegyzek*"]
  tax:
    globs: ["*steuer*", "*finanzamt*", "*tax_*", "*_tax*", "*adobevallas*",
            "*ado_*", "*_ado*"]
  contracts:
    globs: ["*vertrag*", "*contract*", "*szerzodes*"]
  warranty:
    globs: ["*garantie*", "*warranty*", "*garancia*"]
  manuals:
    globs: ["*anleitung*", "*bedienungsanleitung*", "*handbuch*", "*manual*",
            "*instructions*", "*kezikonyv*", "*utmutato*"]
  certificates:
    globs: ["*zeugnis*", "*diplom*", "*certificate*", "*urkunde*",
            "*bizonyitvany*", "*oklevel*"]
  correspondence:
    globs: ["*brief*", "*letter*", "*schreiben*", "*level_*", "*_level*"]
  subscriptions:
    globs: ["*abo_*", "*_abo*", "*abonnement*", "*subscription*", "*elofizetes*"]
  real_estate:
    globs: ["*miete*", "*mietvertrag*", "*rent_*", "*_rent*", "*lease*",
            "*berleti*"]
  vehicle:
    globs: ["*kfz*", "*fahrzeug*", "*vehicle*", "*gepjarmu*", "*forgalmi*"]
  employment:
    globs: ["*arbeitsvertrag*", "*dienstvertrag*", "*employment_contract*",
            "*munkaszerzodes*"]
